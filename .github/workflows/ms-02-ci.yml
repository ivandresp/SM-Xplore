## Integración continua de ms-02: compilación, pruebas con Testcontainers (MongoDB), build de la
## imagen Docker, escaneo con Trivy y smoke test del contenedor contra MongoDB en replica set y Kafka.
##
## Docker es obligatorio: si Testcontainers no puede arrancar, el job falla en vez de omitir
## pruebas en silencio (scripts/assert-no-skipped-tests.py).

name: ms-02 CI

on:
  push:
    branches: [main, microservicios, ms-security-reports]
    paths:
      - "microservices/ms-02-security-reports/**"
      - "contracts/**"
      - "infrastructure/compose.yaml"
      - ".github/workflows/ms-02-ci.yml"
      - ".gitattributes"
      - ".github/scripts/assert-no-skipped-tests.py"
  pull_request:
    paths:
      - "microservices/ms-02-security-reports/**"
      - "contracts/**"
      - "infrastructure/compose.yaml"
      - ".github/workflows/ms-02-ci.yml"
      - ".gitattributes"
      - ".github/scripts/assert-no-skipped-tests.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ms-02-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SERVICE_DIR: microservices/ms-02-security-reports
  IMAGE_NAME: smxplore/ms-02:local

jobs:
  verify:
    name: Compilar y verificar
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Comprobar que Docker está disponible
        # Sin Docker, Testcontainers marca las pruebas como omitidas y el job quedaría en verde.
        run: |
          docker info > /dev/null
          docker version --format 'Docker cliente {{.Client.Version}} / servidor {{.Server.Version}}'

      - name: Ejecutar pruebas y empaquetar
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          chmod +x gradlew
          mkdir -p build
          set -o pipefail
          ./gradlew test bootJar --no-daemon --console=plain 2>&1 | tee build/test.log

      - name: Fallar si alguna prueba se omitió
        # P2-11: ninguna prueba que necesite Docker puede omitirse en silencio.
        working-directory: ${{ env.SERVICE_DIR }}
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/assert-no-skipped-tests.py" --root .

      - name: Anotar los fallos de las pruebas
        if: failure()
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          python3 - <<'PY' || true
          import glob
          import xml.etree.ElementTree as ElementTree

          for path in sorted(glob.glob("build/test-results/test/TEST-*.xml")):
              try:
                  suite = ElementTree.parse(path).getroot()
              except ElementTree.ParseError:
                  continue
              for case in suite.iter("testcase"):
                  failure = case.find("failure")
                  if failure is None:
                      failure = case.find("error")
                  if failure is None:
                      continue
                  message = (failure.get("message") or "").strip().splitlines()
                  detail = message[0][:400] if message else "sin mensaje"
                  detail = detail.replace("%", "%25").replace("\r", " ").replace("\n", " ")
                  detail = detail.replace("::", " ")
                  title = f"{case.get('classname')}.{case.get('name')}"
                  print(f"::error title={title}::{detail}")
          PY
          if [ -f build/test.log ]; then
            grep -E "FAILED|error:" build/test.log | tail -n 15 | while IFS= read -r line; do
              line="${line//%/%25}"
              line="${line//::/ }"
              echo "::error title=Verificación ms-02::${line}"
            done
            echo "## Fallos de la verificación" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 40 build/test.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publicar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ms-02-test-reports
          path: |
            ${{ env.SERVICE_DIR }}/build/reports/tests/test
            ${{ env.SERVICE_DIR }}/build/test-results/test
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Imagen Docker y smoke test
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir la imagen
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.SERVICE_DIR }}
          file: ${{ env.SERVICE_DIR }}/Dockerfile
          tags: ${{ env.IMAGE_NAME }}
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Analizar la imagen con Trivy
        env:
          TRIVY_IMAGE: aquasec/trivy:0.68.2
        run: |
          set +e
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "${TRIVY_IMAGE}" image \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --timeout 15m \
            --exit-code 1 \
            "${IMAGE_NAME}" 2>&1 | tee trivy-report.txt
          code=${PIPESTATUS[0]}
          if [ "${code}" -ne 0 ]; then
            echo "::error title=Trivy (exit ${code})::$(grep -E 'CVE-[0-9]{4}-[0-9]+|^ERROR|^FATAL' trivy-report.txt | head -n 5 | tr '\n' ' ')"
          fi
          exit "${code}"

      - name: Publicar el reporte de Trivy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ms-02-trivy-report
          path: trivy-report.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Levantar Kafka y la red compartida
        run: |
          docker compose -f infrastructure/compose.yaml up -d --wait --wait-timeout 240 kafka

      - name: Levantar MongoDB en replica set
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          docker compose up -d mongo
          docker compose run --rm mongo-init

      - name: Arrancar el servicio
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          docker run -d --name ms-02 --network smxplore-net -p 8080:8080 \
            -e MONGODB_URI="mongodb://mongo:27017/security_reports?replicaSet=rs0" \
            -e KAFKA_BOOTSTRAP_SERVERS="kafka:9092" \
            -e JWT_PUBLIC_KEY_LOCATION="file:/keys/test-public.pem" \
            -e JWT_ISSUER="sm-xplore-ms-01" \
            -e JWT_AUDIENCE="sm-xplore-services" \
            -e OUTBOX_ENABLED="true" \
            -e MONGO_AUTO_INDEX_CREATION="true" \
            -v "$PWD/src/test/resources/keys/test-public.pem:/keys/test-public.pem:ro" \
            "${{ env.IMAGE_NAME }}"

      - name: Verificar el estado del servicio
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "ms-02 respondió UP en el intento ${attempt}"
              curl -fsS http://localhost:8080/actuator/health
              curl -fsS -o /dev/null -w "OpenAPI: %{http_code}\n" http://localhost:8080/v3/api-docs
              exit 0
            fi
            sleep 2
          done
          echo "ms-02 no respondió UP; se muestran los logs del contenedor"
          docker logs ms-02
          exit 1

      - name: Mostrar logs si algo falló
        if: failure()
        run: docker logs --no-color ms-02 || true

      - name: Apagar el stack
        if: always()
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          docker rm -f ms-02 || true
          docker compose down -v --remove-orphans || true
          docker compose -f infrastructure/compose.yaml down -v --remove-orphans || true
