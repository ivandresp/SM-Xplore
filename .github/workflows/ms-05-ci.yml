## Integración continua de ms-05: compilación, pruebas con Testcontainers (Kafka y Neo4j), build de
## la imagen Docker, escaneo con Trivy y smoke test del contenedor contra Neo4j y Kafka.
##
## Docker es obligatorio: si Testcontainers no puede arrancar, el job falla en vez de omitir
## pruebas en silencio (scripts/assert-no-skipped-tests.py).

name: ms-05 CI

on:
  push:
    branches: [main, microservicios, ms-recommendations]
    paths:
      - "microservices/ms-05-recommendations/**"
      # Los tests de contrato leen los esquemas versionados del repositorio.
      - "contracts/**"
      - "infrastructure/compose.yaml"
      - ".github/workflows/ms-05-ci.yml"
      # Si cambian los finales de línea, el build de la imagen puede romperse (./gradlew: not found).
      - ".gitattributes"
      - ".github/scripts/assert-no-skipped-tests.py"
  pull_request:
    paths:
      - "microservices/ms-05-recommendations/**"
      - "contracts/**"
      - "infrastructure/compose.yaml"
      - ".github/workflows/ms-05-ci.yml"
      - ".gitattributes"
      - ".github/scripts/assert-no-skipped-tests.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ms-05-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SERVICE_DIR: microservices/ms-05-recommendations
  IMAGE_NAME: smxplore/ms-05:local

jobs:
  verify:
    name: Compilar y verificar
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Comprobar que Docker está disponible
        # Sin Docker, Testcontainers marca las pruebas como omitidas y el job quedaría en verde.
        run: |
          docker info > /dev/null
          docker version --format 'Docker cliente {{.Client.Version}} / servidor {{.Server.Version}}'

      - name: Ejecutar pruebas y empaquetar
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          chmod +x gradlew
          mkdir -p build
          set -o pipefail
          ./gradlew test bootJar --no-daemon --console=plain 2>&1 | tee build/test.log

      - name: Fallar si alguna prueba se omitió
        # P2-11: ninguna prueba que necesite Docker puede omitirse en silencio.
        working-directory: ${{ env.SERVICE_DIR }}
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/assert-no-skipped-tests.py" --root .

      - name: Anotar los fallos de las pruebas
        if: failure()
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          python3 - <<'PY' || true
          import glob
          import xml.etree.ElementTree as ElementTree

          for path in sorted(glob.glob("build/test-results/test/TEST-*.xml")):
              try:
                  suite = ElementTree.parse(path).getroot()
              except ElementTree.ParseError:
                  continue
              for case in suite.iter("testcase"):
                  failure = case.find("failure")
                  if failure is None:
                      failure = case.find("error")
                  if failure is None:
                      continue
                  message = (failure.get("message") or "").strip().splitlines()
                  detail = message[0][:400] if message else "sin mensaje"
                  detail = detail.replace("%", "%25").replace("\r", " ").replace("\n", " ")
                  detail = detail.replace("::", " ")
                  title = f"{case.get('classname')}.{case.get('name')}"
                  print(f"::error title={title}::{detail}")
          PY
          if [ -f build/test.log ]; then
            grep -E "FAILED|error:" build/test.log | tail -n 15 | while IFS= read -r line; do
              line="${line//%/%25}"
              line="${line//::/ }"
              echo "::error title=Verificación ms-05::${line}"
            done
            echo "## Fallos de la verificación" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 40 build/test.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publicar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ms-05-test-reports
          path: |
            ${{ env.SERVICE_DIR }}/build/reports/tests/test
            ${{ env.SERVICE_DIR }}/build/test-results/test
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Imagen Docker y smoke test
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Construir la imagen
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ env.SERVICE_DIR }}
          file: ${{ env.SERVICE_DIR }}/Dockerfile
          tags: ${{ env.IMAGE_NAME }}
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Analizar la imagen con Trivy
        env:
          # Imagen fijada por digest (manifest multi-arquitectura, fijado el 2026-11-08).
          # Sin socket de Docker: se exporta la imagen y Trivy la analiza desde el tar.
          TRIVY_IMAGE: aquasec/trivy@sha256:05d0126976bdedcd0782a0336f77832dbea1c81b9cc5e4b3a5ea5d2ec863aca7
        run: |
          set +e
          docker save "${IMAGE_NAME}" -o trivy-image.tar
          docker run --rm -v "${PWD}:/work" "${TRIVY_IMAGE}" image \
            --input /work/trivy-image.tar \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --timeout 15m \
            --exit-code 1 \
            2>&1 | tee trivy-report.txt
          code=${PIPESTATUS[0]}
          if [ "${code}" -ne 0 ]; then
            echo "::error title=Trivy (exit ${code})::$(grep -E 'CVE-[0-9]{4}-[0-9]+|^ERROR|^FATAL' trivy-report.txt | head -n 5 | tr '\n' ' ')"
          fi
          rm -f trivy-image.tar
          exit "${code}"
      - name: Publicar el reporte de Trivy
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ms-05-trivy-report
          path: trivy-report.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Levantar Kafka y la red compartida
        run: |
          docker compose -f infrastructure/compose.yaml up -d --wait --wait-timeout 240 kafka

      - name: Levantar Neo4j
        working-directory: ${{ env.SERVICE_DIR }}
        # El compose del servicio exige NEO4J_PASSWORD desde el endurecimiento MS05-10.
        env:
          NEO4J_PASSWORD: change-me
        run: docker compose up -d --wait --wait-timeout 240 neo4j

      - name: Arrancar el servicio
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          docker run -d --name ms-05 --network smxplore-net -p 8085:8080 \
            -e SPRING_PROFILES_ACTIVE=local \
            -e NEO4J_URI="bolt://neo4j:7687" \
            -e NEO4J_USER="neo4j" \
            -e NEO4J_PASSWORD="change-me" \
            -e NEO4J_INITIALIZE_SCHEMA="true" \
            -e KAFKA_BOOTSTRAP_SERVERS="kafka:9092" \
            -e KAFKA_CONSUMER_GROUP_ID="ms-05-smoke" \
            -e EVENTS_CONSUMER_ENABLED="true" \
            -e JWT_PUBLIC_KEY_LOCATION="file:/keys/test-public.pem" \
            -e JWT_ISSUER="https://ms-05.local" \
            -e SEED_ENABLED="false" \
            -v "$PWD/src/test/resources/keys/test-public.pem:/keys/test-public.pem:ro" \
            "${{ env.IMAGE_NAME }}"

      - name: Verificar el estado del servicio
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8085/actuator/health | grep -q '"status":"UP"'; then
              echo "ms-05 respondió UP en el intento ${attempt}"
              curl -fsS http://localhost:8085/actuator/health
              curl -fsS -o /dev/null -w "OpenAPI: %{http_code}\n" http://localhost:8085/v3/api-docs
              exit 0
            fi
            sleep 2
          done
          echo "ms-05 no respondió UP; se muestran los logs del contenedor"
          docker logs ms-05
          exit 1

      - name: Mostrar logs si algo falló
        if: failure()
        run: docker logs ms-05 || true

      - name: Apagar el stack
        if: always()
        working-directory: ${{ env.SERVICE_DIR }}
        # El compose del servicio exige NEO4J_PASSWORD; el de infraestructura vive en la raíz.
        env:
          NEO4J_PASSWORD: change-me
        run: |
          docker rm -f ms-05 || true
          docker compose down -v --remove-orphans || true
          docker compose -f "$GITHUB_WORKSPACE/infrastructure/compose.yaml" down -v --remove-orphans || true
