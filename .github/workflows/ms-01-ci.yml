## Integración continua de ms-01: compilación, pruebas con Testcontainers, ArchUnit y Spotless,
## además del build de la imagen Docker y un smoke test del contenedor contra PostgreSQL y MongoDB.
##
## Docker es obligatorio: si Testcontainers no puede arrancar, el job falla en vez de omitir
## pruebas en silencio (scripts/assert-no-skipped-tests.py).

name: ms-01 CI

on:
  push:
    branches: [main, micro-users, microservicios]
    paths:
      - "microservices/ms-01-users-and-anomalies/**"
      - ".github/workflows/ms-01-ci.yml"
      - ".github/scripts/assert-no-skipped-tests.py"
  pull_request:
    paths:
      - "microservices/ms-01-users-and-anomalies/**"
      - ".github/workflows/ms-01-ci.yml"
      - ".github/scripts/assert-no-skipped-tests.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ms-01-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SERVICE_DIR: microservices/ms-01-users-and-anomalies
  IMAGE_NAME: smxplore/ms-01:local

jobs:
  verify:
    name: Compilar y verificar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Comprobar que Docker está disponible
        # Sin Docker, Testcontainers marca las pruebas como omitidas y el job quedaría en verde.
        run: |
          docker info > /dev/null
          docker version --format 'Docker cliente {{.Client.Version}} / servidor {{.Server.Version}}'

      - name: Ejecutar check (pruebas, ArchUnit y Spotless)
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          chmod +x gradlew
          mkdir -p build
          set -o pipefail
          ./gradlew check --no-daemon --console=plain 2>&1 | tee build/check.log

      - name: Fallar si alguna prueba se omitió
        # P2-11: ninguna prueba que necesite Docker puede omitirse en silencio.
        working-directory: ${{ env.SERVICE_DIR }}
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/assert-no-skipped-tests.py" --root .

      - name: Anotar los fallos de la verificación
        if: failure()
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          python3 "$GITHUB_WORKSPACE/.github/scripts/annotate_failures.py" || true
          if [ -f build/check.log ]; then
            grep -E "FAILED|error:" build/check.log | tail -n 15 | while IFS= read -r line; do
              line="${line//%/%25}"
              line="${line//::/ }"
              echo "::error title=Verificación ms-01::${line}"
            done
            echo "## Fallos de la verificación" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 40 build/check.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Anotar logs de los contenedores
        if: failure()
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          if compgen -G "build/container-logs/*.log" > /dev/null; then
            MESSAGE="$(for file in build/container-logs/*.log; do
              echo "== $(basename "$file") =="
              tail -n 30 "$file"
            done | tr '\n' '|' | cut -c1-6000 | sed 's/%/%25/g; s/::/: /g')"
            echo "::error title=Logs de contenedores::${MESSAGE}"
          fi

      - name: Publicar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ms-01-test-reports
          path: |
            ${{ env.SERVICE_DIR }}/build/reports/tests/test
            ${{ env.SERVICE_DIR }}/build/test-results/test
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Imagen Docker y smoke test
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Construir la imagen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.SERVICE_DIR }}
          file: ${{ env.SERVICE_DIR }}/Dockerfile
          tags: ${{ env.IMAGE_NAME }}
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Analizar la imagen con Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}
          format: table
          scanners: vuln
          timeout: "15m"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Levantar el servicio con su infraestructura
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          docker compose up -d postgres mongodb mailpit
          docker compose --profile full up -d --no-build --wait --wait-timeout 300

      - name: Verificar el estado del servicio
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8081/actuator/health | grep -q '"status":"UP"'; then
              echo "ms-01 respondió UP en el intento ${attempt}"
              curl -fsS http://localhost:8081/actuator/health
              exit 0
            fi
            sleep 2
          done
          echo "ms-01 no respondió UP; se muestran los logs del contenedor"
          docker compose --profile full logs ms-01
          exit 1

      - name: Mostrar logs si algo falló
        if: failure()
        working-directory: ${{ env.SERVICE_DIR }}
        run: docker compose --profile full logs --no-color

      - name: Apagar el stack
        if: always()
        working-directory: ${{ env.SERVICE_DIR }}
        run: docker compose --profile full down -v --remove-orphans
