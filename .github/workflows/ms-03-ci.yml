## Integración continua de ms-03: compilación, pruebas con Testcontainers (PostgreSQL), build de
## la imagen Docker, escaneo con Trivy y smoke test del contenedor con PostgreSQL y MongoDB.
## El smoke test arranca el servicio con una URL JWKS inalcanzable a propósito: valida el
## arranque, Flyway y Actuator sin depender de ms-01.

name: ms-03 CI

on:
  push:
    branches: [main, microservicios, ms-03-symbolic-reservations]
    paths:
      - "microservices/ms-03-activities-and-events/**"
      - ".github/workflows/ms-03-ci.yml"
      # Si cambian los finales de línea, el build de la imagen puede romperse (./gradlew: not found).
      - ".gitattributes"
  pull_request:
    paths:
      - "microservices/ms-03-activities-and-events/**"
      - ".github/workflows/ms-03-ci.yml"
      - ".gitattributes"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ms-03-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SERVICE_DIR: microservices/ms-03-activities-and-events
  IMAGE_NAME: smxplore/ms-03:local

jobs:
  verify:
    name: Compilar y verificar
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ejecutar pruebas y empaquetar
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          chmod +x gradlew
          mkdir -p build
          set -o pipefail
          ./gradlew test bootJar --no-daemon --console=plain 2>&1 | tee build/test.log

      - name: Anotar los fallos de las pruebas
        if: failure()
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          python3 - <<'PY' || true
          import glob
          import xml.etree.ElementTree as ElementTree

          for path in sorted(glob.glob("build/test-results/test/TEST-*.xml")):
              try:
                  suite = ElementTree.parse(path).getroot()
              except ElementTree.ParseError:
                  continue
              for case in suite.iter("testcase"):
                  failure = case.find("failure") or case.find("error")
                  if failure is None:
                      continue
                  message = (failure.get("message") or "").strip().splitlines()
                  detail = message[0][:400] if message else "sin mensaje"
                  detail = detail.replace("%", "%25").replace("\r", " ").replace("\n", " ")
                  detail = detail.replace("::", " ")
                  title = f"{case.get('classname')}.{case.get('name')}"
                  print(f"::error title={title}::{detail}")
          PY
          if [ -f build/test.log ]; then
            grep -E "FAILED|error:" build/test.log | tail -n 15 | while IFS= read -r line; do
              line="${line//%/%25}"
              line="${line//::/ }"
              echo "::error title=Verificación ms-03::${line}"
            done
            {
              echo "## Fallos de la verificación"
              echo '~~~'
              tail -n 40 build/test.log
              echo '~~~'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Publicar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ms-03-test-reports
          path: |
            ${{ env.SERVICE_DIR }}/build/reports/tests/test
            ${{ env.SERVICE_DIR }}/build/test-results/test
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Imagen Docker y smoke test
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir la imagen
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.SERVICE_DIR }}
          file: ${{ env.SERVICE_DIR }}/Dockerfile
          tags: ${{ env.IMAGE_NAME }}
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Analizar la imagen con Trivy
        # Se ejecuta la imagen oficial de Trivy en lugar de la accion: el resultado sale completo en
        # el log, la version es inmutable y no se depende de un tag que se pueda reescribir.
        env:
          TRIVY_IMAGE: aquasec/trivy:0.68.2
        run: |
          set +e
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "${TRIVY_IMAGE}" image \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --timeout 15m \
            --exit-code 1 \
            "${IMAGE_NAME}" 2>&1 | tee trivy-report.txt
          code=${PIPESTATUS[0]}
          if [ "${code}" -ne 0 ]; then
            echo "::error title=Trivy (exit ${code})::$(grep -E 'CVE-[0-9]{4}-[0-9]+|^ERROR|^FATAL' trivy-report.txt | head -n 5 | tr '\n' ' ')"
          fi
          exit "${code}"

      - name: Publicar el reporte de Trivy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ms-03-trivy-report
          path: trivy-report.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Levantar PostgreSQL y MongoDB
        working-directory: ${{ env.SERVICE_DIR }}
        run: docker compose up -d --wait --wait-timeout 240 postgres mongo

      - name: Arrancar el servicio
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          NETWORK=$(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{end}}' "$(docker compose ps -q postgres)")
          echo "Red de compose: ${NETWORK}"
          docker run -d --name ms-03 --network "${NETWORK}" -p 8082:8082 \
            -e R2DBC_URL="r2dbc:postgresql://postgres:5432/activities_events" \
            -e POSTGRES_USER="postgres" \
            -e POSTGRES_PASSWORD="postgres" \
            -e MONGODB_URI="mongodb://root:change-me@mongo:27017/reviews?authSource=admin&uuidRepresentation=standard" \
            -e FLYWAY_URL="jdbc:postgresql://postgres:5432/activities_events" \
            -e JWK_SET_URI="http://127.0.0.1:9/.well-known/jwks.json" \
            -e JWT_ISSUER="sm-xplore-ms-01" \
            -e JWT_AUDIENCE="sm-xplore-services" \
            -e SPRINGDOC_API_DOCS_ENABLED="true" \
            -e SPRINGDOC_SWAGGER_UI_ENABLED="true" \
            "${IMAGE_NAME}"

      - name: Verificar estado y migraciones
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8082/actuator/health | grep -q '"status":"UP"'; then
              echo "ms-03 respondió UP en el intento ${attempt}"
              curl -fsS http://localhost:8082/actuator/health
              curl -fsS -o /dev/null -w "OpenAPI: %{http_code}\n" http://localhost:8082/v3/api-docs
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:8082/actuator/health | grep -q '"status":"UP"' || {
            docker logs ms-03
            exit 1
          }
          version2=$(docker compose exec -T postgres psql -U postgres -d activities_events -tAc "SELECT count(*) FROM flyway_schema_history WHERE version = '2' AND success")
          test "${version2}" = "1"
          quarantine=$(docker compose exec -T postgres psql -U postgres -d activities_events -tAc "SELECT count(*) FROM reservations_quarantine")
          test "${quarantine}" = "0"
          status=$(curl -s -o /dev/null -w '%{http_code}' 'http://localhost:8082/api/v1/reservations?status=CONFIRMED')
          echo "Reservas sin token: ${status}"
          test "${status}" = "401"

      - name: Mostrar logs si algo falló
        if: failure()
        run: docker logs --no-color ms-03 || true

      - name: Apagar el stack
        if: always()
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          docker rm -f ms-03 || true
          docker compose down -v --remove-orphans || true
