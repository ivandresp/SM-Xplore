## Integración continua del stack integrado.
##
## Los workflows por servicio validan un servicio contra sus propias dependencias. Este valida lo que
## ninguno miraba: que compose.yaml y los compose por servicio sigan siendo válidos, que los scripts
## de smoke no tengan errores de sintaxis y que el stack completo arranque y ejecute un flujo de
## negocio real (identidad -> catálogo -> actividad -> reseña -> reserva) con los eventos saliendo
## por el outbox.

name: Stack CI

on:
  push:
    branches: [main, microservicios]
    paths: &stack-paths
      - "compose.yaml"
      - "deploy/**"
      - "scripts/**"
      - "infrastructure/**"
      - ".env.example"
      - ".github/workflows/stack-ci.yml"
      # El stack es el unico job que detecta regresiones de arranque entre servicios
      # (variables obligatorias, guards de JWT, @ConfigurationProperties sin registrar).
      - "microservices/*/src/main/resources/**"
      - "microservices/*/Dockerfile"
      - "microservices/*/build.gradle.kts"
      - "microservices/*/docker-compose.yml"
      - "contracts/**"
  pull_request:
    paths: *stack-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Variables de interpolación comunes a los compose.
env:
  JWT_ISSUER: sm-xplore-ms-01
  JWT_AUDIENCE: sm-xplore-services

jobs:
  definitions:
    name: Validar compose y scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Solo ms-03 las declara como :?required; acotadas a este job para no reconfigurar el
      # stack raíz (compose.yaml usa POSTGRES_PASSWORD con default smxplore).
      POSTGRES_USER: ms03_app
      POSTGRES_PASSWORD: ms03-app
      POSTGRES_ROOT_PASSWORD: postgres-root
      FLYWAY_USER: ms03_flyway
      FLYWAY_PASSWORD: ms03-flyway
      MONGO_ROOT_PASSWORD: mongo-root
      MONGO_APP_USER: reviews_app
      MONGO_APP_PASSWORD: reviews-app
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validar el compose raíz
        run: docker compose -f compose.yaml config --quiet

      - name: Validar los compose por servicio
        run: |
          shopt -s nullglob
          files=(microservices/*/docker-compose.yml)
          if [ "${#files[@]}" -ne 5 ]; then
            echo "::error title=Compose por servicio::se esperaban 5 compose y hay ${#files[@]}"
            exit 1
          fi
          status=0
          for file in "${files[@]}"; do
            service=$(dirname "$file")
            echo "::group::docker compose config en $service"
            if ! (cd "$service" && docker compose config --quiet); then
              echo "::error title=Compose inválido::$service/docker-compose.yml"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

      - name: Validar el compose de infraestructura
        run: docker compose -f infrastructure/compose.yaml config --quiet

      - name: Validar invariantes del compose de produccion
        run: |
          set -euo pipefail
          file=deploy/prod/compose.yaml
          status=0

          # PLAT-03: solo el gateway publica en todas las interfaces; el resto solo en 127.0.0.1.
          if grep -nE '^\s+- "\$\{[A-Z0-9_]+:\?\}:[0-9]+"' "$file" | grep -v 'GATEWAY_'; then
            echo "::error title=PLAT-03::hay puertos publicados fuera de 127.0.0.1 en $file"
            status=1
          fi
          if ! grep -q '127.0.0.1:\${MS01_PORT:?}' "$file"; then
            echo "::error title=PLAT-03::los servicios deben publicarse en 127.0.0.1"
            status=1
          fi

          # PLAT-01: Kafka autenticado (SASL_SSL) y sin autocreacion de topics.
          if grep -q 'INTERNAL:PLAINTEXT' "$file"; then
            echo "::error title=PLAT-01::el listener INTERNAL de Kafka no puede ser PLAINTEXT"
            status=1
          fi
          if ! grep -q 'KAFKA_LISTENER_SECURITY_PROTOCOL_MAP:.*INTERNAL:SASL_SSL' "$file"; then
            echo "::error title=PLAT-01::falta KAFKA_LISTENER_SECURITY_PROTOCOL_MAP con INTERNAL:SASL_SSL"
            status=1
          fi
          if ! grep -q 'KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"' "$file"; then
            echo "::error title=PLAT-01::KAFKA_AUTO_CREATE_TOPICS_ENABLE debe ser false en produccion"
            status=1
          fi

          # PLAT-17: el administrador inicial no se crea solo.
          if ! grep -q 'BOOTSTRAP_ADMIN_ENABLED: \${BOOTSTRAP_ADMIN_ENABLED:-false}' "$file"; then
            echo "::error title=PLAT-17::BOOTSTRAP_ADMIN_ENABLED debe ser false por defecto"
            status=1
          fi

          # PLAT-13/PLAT-14: sin etiquetas flotantes en produccion.
          if grep -nE ':(latest|main|stable)(["@ ]|$)' deploy/prod/.env.prod.example; then
            echo "::error title=PLAT-13::etiqueta flotante en deploy/prod/.env.prod.example"
            status=1
          fi

          exit $status

      - name: Validar scripts/smoke.sh
        run: bash -n scripts/smoke.sh

      - name: Validar scripts/smoke.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD "scripts/smoke.ps1"), [ref]$null, [ref]$errors) | Out-Null
          if ($errors -and $errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host "::error title=smoke.ps1::$($_.Message)" }
            exit 1
          }

      - name: Validar los scripts de inicialización
        run: |
          bash -n deploy/postgres/01-databases.sh
          bash -n deploy/mongo/init-replica.sh
          bash -n deploy/mongo/init-replica-auth.sh
          bash -n deploy/backup/backup.sh
          bash -n deploy/backup/restore.sh
          bash -n deploy/backup/verify-backup.sh
          bash -n deploy/kafka/gen-tls.sh
          bash -n deploy/kafka/create-acls.sh
          bash -n deploy/kafka/render-client-config.sh
          bash -n deploy/kafka/create-topics.sh
          bash -n scripts/kafka-dlq-replay.sh

  stack:
    name: Stack completo y flujo de negocio
    needs: definitions
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Construir las imágenes
        run: docker compose build

      - name: Levantar el stack
        run: docker compose up -d --wait --wait-timeout 900

      - name: Smoke del stack (incluye métricas y flujo de negocio)
        env:
          # El stack ya está UP (docker compose up --wait): no hace falta esperar 5 min por servicio.
          WAIT_SECONDS: 60
        run: bash scripts/smoke.sh

      # PLAT-21: los logs se publican solo si el job falla y se filtran antes de subirlos.
      # El smoke crea un admin, un turista y una reserva; los logs de ms-01 pueden
      # contener cabeceras `Authorization`, correos de Mailpit y URLs de reset, así
      # que se descartan las líneas con secretos y se recorta a las últimas 3000.
      - name: Estado del stack si algo falló
        if: failure()
        run: |
          mkdir -p stack-logs
          docker compose ps --format 'table {{.Name}}\t{{.Service}}\t{{.State}}\t{{.Health}}' \
            > stack-logs/compose-ps.txt || true
          docker compose logs --no-color --tail 5000 2>&1 \
            | grep -viE 'password|passwd|token|authorization|cookie|set-cookie|secret|bearer|api[_-]?key|reset' \
            > stack-logs/compose.log || true
          echo "::warning title=Logs del stack::Los logs publicados estan filtrados (PLAT-21); si necesitas una traza concreta, reproduce el fallo en local con el stack completo."

      - name: Publicar los logs del stack si algo falló
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stack-logs
          path: stack-logs/
          if-no-files-found: ignore
          # PLAT-21: retención corta; el artefacto contiene trazas del stack de pruebas.
          retention-days: 3

      - name: Apagar el stack
        if: always()
        run: docker compose down -v --remove-orphans