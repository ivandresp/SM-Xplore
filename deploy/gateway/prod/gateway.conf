# =============================================================================
# SM-Xplore - servidores del gateway en PRODUCCION (PLAT-03)
# =============================================================================
# Se monta en deploy/prod/compose.yaml en lugar de conf.d/gateway.conf:
#
#   - ../gateway/prod/gateway.conf:/etc/nginx/conf.d/gateway.conf:ro
#
# Diferencias con el gateway de desarrollo (conf.d/gateway.conf):
#   1. El puerto 80 NO publica la API: solo conserva /healthz (lo usa el
#      healthcheck del contenedor) y redirige todo lo demas a HTTPS con 308.
#   2. El puerto 443 es el unico que sirve routes.conf, es decir, toda la API
#      viaja cifrada. Los servicios de aplicacion siguen publicados solo en
#      127.0.0.1 (ver compose.yaml) y la infraestructura no se publica.
#   3. Se envia HSTS para que el navegador no vuelva a intentar HTTP.
#
# Certificados: /etc/nginx/certs/tls.crt y tls.key, inyectados como secretos
# (TLS_SELF_SIGNED no se usa aqui: entrypoint.sh no se ejecuta en produccion).
# =============================================================================

# --- HTTP: solo redireccion a HTTPS -------------------------------------------
server {
    listen 80;
    server_name _;

    # PLAT-10: mismo limite de conexiones por IP que el server TLS.
    limit_conn conn_per_ip 20;

    # El healthcheck del contenedor consulta esta ruta en claro (wget sobre :80).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 308 conserva el metodo y el cuerpo; 301/302 no lo garantizan en todos los
    # clientes. No se incluye routes.conf: por HTTP no se sirve ni una ruta de API.
    location / {
        return 308 https://$host$request_uri;
    }

    error_page 429 = @gateway_rate_limited;
    location @gateway_rate_limited {
        default_type application/problem+json;
        add_header Retry-After 1 always;
        return 429 '{"type":"about:blank","title":"Demasiadas peticiones","status":429,"detail":"Se supero el limite de peticiones por IP; espere unos segundos y reintente"}';
    }
}

# --- HTTPS: superficie completa de la API -------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_prefer_server_ciphers off;

    # PLAT-10: maximo de conexiones simultaneas por IP (zona en nginx.conf).
    limit_conn conn_per_ip 20;

    # HSTS: una vez visto, el navegador no reintenta HTTP durante un ano.
    # includeSubDomains solo si todos los subdominios son HTTPS; si el equipo de
    # plataforma publica subdominios en claro, quitar ese parametro.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    include /etc/nginx/snippets/routes.conf;

    error_page 502 504 = @gateway_bad_gateway;
    location @gateway_bad_gateway {
        default_type application/problem+json;
        return 503 '{"type":"about:blank","title":"Servicio no disponible","status":503,"detail":"El servicio de destino no respondio a traves del gateway"}';
    }

    # Rate limiting por peticion: nginx devuelve 429 cuando se supera una zona
    # (ver nginx.conf y snippets/routes.conf).
    error_page 429 = @gateway_rate_limited;
    location @gateway_rate_limited {
        default_type application/problem+json;
        add_header Retry-After 1 always;
        return 429 '{"type":"about:blank","title":"Demasiadas peticiones","status":429,"detail":"Se supero el limite de peticiones por IP; espere unos segundos y reintente"}';
    }
}
