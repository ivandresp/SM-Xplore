# =============================================================================
# SM-Xplore - configuracion global del API gateway (nginx)
# =============================================================================
# Este archivo es el punto de entrada de nginx: define lo comun a todos los
# servicios y delega las rutas en /etc/nginx/conf.d/*.conf.
#
# Se monta desde el repositorio en compose.yaml (deploy/gateway/nginx.conf), por
# lo que editarlo solo requiere reiniciar el contenedor del gateway:
#   docker compose restart gateway
#
# Rutas: ver deploy/gateway/README.md (tabla completa) y
# deploy/gateway/snippets/routes.conf (mapeo ruta -> servicio).
# =============================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # -------------------------------------------------------------------------
    # Identificador de peticion
    # -------------------------------------------------------------------------
    # Si el cliente manda X-Request-Id se respeta; si no, nginx genera uno y lo
    # propaga a los servicios. Los logs del gateway y los de los servicios
    # pueden correlacionarse con el mismo identificador.
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rid=$req_id '
                    'rt=$request_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    # Tamano maximo de cuerpo: las fotos de reportes de seguridad (ms-02) y los
    # documentos de auditoria viajan por aqui. 10 MB es holgado para el dominio.
    client_max_body_size 10m;
    client_body_timeout  30s;

    gzip on;
    gzip_min_length 512;
    gzip_types application/json application/problem+json text/plain;

    # -------------------------------------------------------------------------
    # Cabeceras comunes hacia los servicios
    # -------------------------------------------------------------------------
    # Host, IP original y esquema son imprescindibles para que los servicios
    # (y sus logs de auditoria) vean la peticion real del cliente y no la del
    # gateway. Connection "" limpia el header hop-by-hop y habilita keepalive.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_set_header X-Request-Id      $req_id;
    proxy_set_header Connection        "";

    # Tiempos: los endpoints de reportes (CSV/PDF) y el reindex de ms-05 pueden
    # tardar mas que una consulta normal, pero no deben colgar el gateway.
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # -------------------------------------------------------------------------
    # Upstreams: nombres de servicio del compose (= DNS interno de la red)
    # -------------------------------------------------------------------------
    # keepalive mantiene conexiones reutilizables con cada servicio, que es la
    # diferencia entre pagar un handshake TCP por peticion o no.
    upstream ms_01 { server ms-01:8081; keepalive 16; }
    upstream ms_02 { server ms-02:8080; keepalive 16; }
    upstream ms_03 { server ms-03:8082; keepalive 16; }
    upstream ms_04 { server ms-04:8080; keepalive 16; }
    upstream ms_05 { server ms-05:8080; keepalive 16; }

    include /etc/nginx/conf.d/*.conf;
}
