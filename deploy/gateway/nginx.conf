# =============================================================================
# SM-Xplore - configuracion global del API gateway (nginx)
# =============================================================================
# Este archivo es el punto de entrada de nginx: define lo comun a todos los
# servicios y delega las rutas en /etc/nginx/conf.d/*.conf.
#
# Se monta desde el repositorio en compose.yaml (deploy/gateway/nginx.conf), por
# lo que editarlo solo requiere reiniciar el contenedor del gateway:
#   docker compose restart gateway
#
# Rutas: ver deploy/gateway/README.md (tabla completa) y
# deploy/gateway/snippets/routes.conf (mapeo ruta -> servicio).
# =============================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # -------------------------------------------------------------------------
    # Identificador de peticion
    # -------------------------------------------------------------------------
    # Si el cliente manda X-Request-Id se respeta; si no, nginx genera uno y lo
    # propaga a los servicios. Los logs del gateway y los de los servicios
    # pueden correlacionarse con el mismo identificador.
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rid=$req_id '
                    'rt=$request_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    # Tamano maximo de cuerpo: las fotos de reportes de seguridad (ms-02) y los
    # documentos de auditoria viajan por aqui. 10 MB es holgado para el dominio.
    client_max_body_size 10m;
    client_body_timeout  30s;

    gzip on;
    gzip_min_length 512;
    gzip_types application/json application/problem+json text/plain;

    # -------------------------------------------------------------------------
    # Rate limiting por IP real (MS01-01)
    # -------------------------------------------------------------------------
    # $binary_remote_addr es la IP TCP del cliente tal como la ve nginx: NO se
    # puede falsear con X-Forwarded-For ni X-Real-IP. Como el gateway sobrescribe
    # esas cabeceras (ver "Cabeceras comunes" mas abajo), el limite y los logs de
    # los servicios usan la misma IP, sin ventanas evadibles rotando cabeceras.
    #
    # Zonas (cubos independientes por IP):
    #   auth   30 r/m  -> /api/v1/auth/ (login, MFA, recuperacion)
    #   public 120 r/m -> GET del catalogo publico y recomendaciones
    #   api    600 r/m -> resto de la superficie publicada
    #
    # Los burst y el nodelay viven en snippets/routes.conf, junto a cada location.
    # El tamano (10m) es memoria compartida por zona: ~160.000 IPs por zona.
    limit_req_zone $binary_remote_addr zone=auth:10m   rate=30r/m;
    limit_req_zone $binary_remote_addr zone=public:10m rate=120r/m;
    limit_req_zone $binary_remote_addr zone=api:10m    rate=600r/m;
    # 429 en lugar del 503 por defecto; conf.d/gateway.conf lo convierte en
    # application/problem+json con Retry-After.
    limit_req_status 429;
    limit_req_log_level warn;

    # -------------------------------------------------------------------------
    # Cabeceras comunes hacia los servicios
    # -------------------------------------------------------------------------
    # Host, IP original y esquema son imprescindibles para que los servicios
    # (y sus logs de auditoria) vean la peticion real del cliente y no la del
    # gateway. Connection "" limpia el header hop-by-hop y habilita keepalive.
    #
    # X-Forwarded-For se SOBRESCRIBE con $remote_addr (nunca se usa
    # $proxy_add_x_forwarded_for): asi una cabecera enviada por el cliente no
    # llega al servicio ni puede abrir un cubo de rate limit distinto. Los
    # servicios deben usar X-Real-IP (tambien sobrescrita) o la IP TCP, nunca la
    # cadena de XFF recibida.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_set_header X-Request-Id      $req_id;
    proxy_set_header Connection        "";

    # Tiempos: los endpoints de reportes (CSV/PDF) y el reindex de ms-05 pueden
    # tardar mas que una consulta normal, pero no deben colgar el gateway.
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # -------------------------------------------------------------------------
    # Upstreams: nombres de servicio del compose (= DNS interno de la red)
    # -------------------------------------------------------------------------
    # keepalive mantiene conexiones reutilizables con cada servicio, que es la
    # diferencia entre pagar un handshake TCP por peticion o no.
    upstream ms_01 { server ms-01:8081; keepalive 16; }
    upstream ms_02 { server ms-02:8080; keepalive 16; }
    upstream ms_03 { server ms-03:8082; keepalive 16; }
    upstream ms_04 { server ms-04:8080; keepalive 16; }
    upstream ms_05 { server ms-05:8080; keepalive 16; }

    include /etc/nginx/conf.d/*.conf;
}
