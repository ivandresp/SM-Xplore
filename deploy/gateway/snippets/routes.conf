# =============================================================================
# SM-Xplore - tabla de rutas del API gateway
# =============================================================================
# Este bloque se incluye DENTRO de cada server (HTTP y HTTPS), por eso no
# declara server ni upstream: solo locations.
#
# Criterio de ruteo:
#   1. Rutas "bonitas": solo para prefijos que pertenecen a UN solo servicio.
#   2. Namespace /svc/ms-0N/...: acceso 1:1 al resto de endpoints del servicio N
#      (nginx recorta el prefijo con el "/" final del proxy_pass). Sirve para los
#      paths que chocan entre servicios y como escape para integraciones.
#   3. /actuator/** y /internal/** NUNCA se exponen (404), tampoco bajo /svc/.
#
# Cache (pendientes del PL, items 1-2): las locations de solo lectura del
# catalogo publico incluyen snippets/public-cache.conf (cache compartido de 10s,
# GET anonimos). Las escrituras y las peticiones con Authorization no se cachean.
#
# Rate limiting (MS01-01): cada location declara una de las tres zonas definidas
# en nginx.conf; la clave es $binary_remote_addr (IP TCP, no falseable):
#   zone=auth   burst=10 nodelay  -> /api/v1/auth/ (fuerza bruta de login/MFA)
#   zone=public burst=40 nodelay  -> lectura del catalogo publico y recomendaciones
#   zone=api    burst=100 nodelay -> resto de la superficie publicada
# Las tres zonas responden la rafaga de inmediato (nodelay): el rate solo decide
# cuando se agota el burst, momento en que el exceso responde 429 sin encolar.
# (Sin nodelay nginx esperaba hasta burst/rate segundos por peticion y una pagina
#  con varias consultas en paralelo tardaba segundos; ver README, seccion 7.)
#
# Si agregas un endpoint nuevo a un servicio, agrega aqui la location
# correspondiente; si no lo haces, respondera 404 a traves del gateway.
# =============================================================================

# --- Firmas publicas de ms-01 -------------------------------------------------
location = /.well-known/jwks.json {
    limit_req zone=api burst=100 nodelay;
    proxy_pass http://ms_01;
}

# --- ms-01: identidad, usuarios, administracion de usuarios/cuentas -----------
# El login/MFA esta en su propia zona: es el objetivo de fuerza bruta y de
# bombardeo de correos, y debe fallar antes que el resto del trafico.
location /api/v1/auth/ {
    limit_req zone=auth burst=10 nodelay;
    proxy_pass http://ms_01;
}
location /api/v1/users/ {
    limit_req zone=api burst=100 nodelay;
    proxy_pass http://ms_01;
}
location /api/v1/public/ {
    limit_req zone=api burst=100 nodelay;
    proxy_pass http://ms_01;
}
location /api/v1/admin/users {
    limit_req zone=api burst=100 nodelay;
    proxy_pass http://ms_01;
}
location /api/v1/admin/anomalies {
    limit_req zone=api burst=100 nodelay;
    proxy_pass http://ms_01;
}
location /api/v1/admin/anomaly-thresholds {
    limit_req zone=api burst=100 nodelay;
    proxy_pass http://ms_01;
}
location /api/v1/admin/audit-logs {
    limit_req zone=api burst=100 nodelay;
    proxy_pass http://ms_01;
}
location /api/v1/admin/monitoring {
    limit_req zone=api burst=100 nodelay;
    proxy_pass http://ms_01;
}
location /api/v1/admin/reviews/reported {
    limit_req zone=api burst=100 nodelay;
    proxy_pass http://ms_01;
}

# --- Gestoras aprueban el registro de guias (ms-01, item 16 del txt del PL) ---
location /api/v1/manager/ {
    limit_req zone=api burst=100 nodelay;
    proxy_pass http://ms_01;
}

# --- ms-02: reportes de seguridad --------------------------------------------
location /api/v1/security-reports {
    limit_req zone=api burst=100 nodelay;
    proxy_pass http://ms_02;
}

# --- ms-03: actividades, eventos y reservas -----------------------------------
location /api/v1/activities {
    limit_req zone=public burst=40 nodelay;
    include /etc/nginx/snippets/public-cache.conf;
    proxy_pass http://ms_03;
}
location /api/v1/events {
    limit_req zone=public burst=40 nodelay;
    include /etc/nginx/snippets/public-cache.conf;
    proxy_pass http://ms_03;
}
location /api/v1/review-reports {
    limit_req zone=public burst=40 nodelay;
    proxy_pass http://ms_03;
}

# ms-04 gana estas dos rutas de reservas aunque el prefijo general es ms-03.
location = /api/v1/reservations/availability {
    limit_req zone=api burst=100 nodelay;
    proxy_pass http://ms_04;
}
location ~ ^/api/v1/reservations/[^/]+/status$ {
    limit_req zone=api burst=100 nodelay;
    proxy_pass http://ms_04;
}
# Resto de reservas (crear, cancelar, asistencia, no-show, consultas) = ms-03.
location /api/v1/reservations {
    limit_req zone=api burst=100 nodelay;
    proxy_pass http://ms_03;
}

# --- Reparto de /api/v1/reviews ----------------------------------------------
# Solo se exponen por nombre corto las variantes nunca ambiguas. El POST de
# respuesta y el POST de reporte existen en ms-01, ms-03 y ms-04 con el mismo
# path, por lo que esos se usan via /svc/ms-0N/...
location ~ ^/api/v1/reviews/(events|activities)(/|$) {
    limit_req zone=public burst=40 nodelay;
    proxy_pass http://ms_03;
}
location ~ ^/api/v1/reviews/(summary|reputation)$ {
    limit_req zone=public burst=40 nodelay;
    proxy_pass http://ms_04;
}
location ~ ^/api/v1/reviews/[^/]+/status$ {
    limit_req zone=public burst=40 nodelay;
    proxy_pass http://ms_04;
}

# --- ms-04: catalogo, notificaciones -----------------------------------------
location /api/v1/sites {
    limit_req zone=public burst=40 nodelay;
    include /etc/nginx/snippets/public-cache.conf;
    proxy_pass http://ms_04;
}
location /api/v1/services {
    limit_req zone=public burst=40 nodelay;
    include /etc/nginx/snippets/public-cache.conf;
    proxy_pass http://ms_04;
}
location /api/v1/categories {
    limit_req zone=public burst=40 nodelay;
    include /etc/nginx/snippets/public-cache.conf;
    proxy_pass http://ms_04;
}
location /api/v1/zones {
    limit_req zone=public burst=40 nodelay;
    include /etc/nginx/snippets/public-cache.conf;
    proxy_pass http://ms_04;
}
location /api/v1/notifications {
    limit_req zone=api burst=100 nodelay;
    proxy_pass http://ms_04;
}
location /api/v1/admin/notification-contacts {
    limit_req zone=api burst=100 nodelay;
    proxy_pass http://ms_04;
}
location /api/v1/admin/outbox {
    limit_req zone=api burst=100 nodelay;
    proxy_pass http://ms_04;
}
# Por defecto se asume el feed de ms-04 (CATEGORIES|SITES|SERVICES). Para
# entity=ACTIVITIES|EVENTS usar /svc/ms-03/api/v1/admin/catalog/export.
location /api/v1/admin/catalog/export {
    limit_req zone=api burst=100 nodelay;
    proxy_pass http://ms_04;
}

# --- ms-05: recomendaciones ---------------------------------------------------
location /api/v1/recommendations {
    limit_req zone=public burst=40 nodelay;
    proxy_pass http://ms_05;
}
location /api/v1/preferences {
    limit_req zone=api burst=100 nodelay;
    proxy_pass http://ms_05;
}
location /api/v1/interactions {
    limit_req zone=api burst=100 nodelay;
    proxy_pass http://ms_05;
}

# --- Namespace 1:1 (recorta /svc/ms-0N/ antes de reenviar) --------------------
# El login/MFA de ms-01 tampoco puede saltarse la zona auth entrando por el
# namespace: sin esto /svc/ms-01/api/v1/auth/login caeria en zone=api y
# multiplicaria el margen de fuerza bruta (auditoria final 2026-11-08).
location /svc/ms-01/api/v1/auth/ {
    limit_req zone=auth burst=10 nodelay;
    proxy_pass http://ms_01/;
}
location /svc/ms-01/ {
    limit_req zone=api burst=100 nodelay;
    proxy_pass http://ms_01/;
}
location /svc/ms-02/ {
    limit_req zone=api burst=100 nodelay;
    proxy_pass http://ms_02/;
}
location /svc/ms-03/ {
    limit_req zone=api burst=100 nodelay;
    proxy_pass http://ms_03/;
}
location /svc/ms-04/ {
    limit_req zone=api burst=100 nodelay;
    proxy_pass http://ms_04/;
}
location /svc/ms-05/ {
    limit_req zone=api burst=100 nodelay;
    proxy_pass http://ms_05/;
}

# --- Superficie que el gateway NO publica ------------------------------------
# actuator (metricas internas) e internal (reindex de ms-05). Los ^~ evitan
# que una regex posterior los reescriba; la regex cubre el namespace /svc/.
location ^~ /actuator/                     { return 404; }
location ^~ /internal/                     { return 404; }
location ~ ^/svc/ms-0[1-5]/(actuator|internal)/ { return 404; }

# --- Sin ruta: 404 explicito en formato problem+json -------------------------
location / {
    limit_req zone=api burst=100 nodelay;
    default_type application/problem+json;
    return 404 '{"type":"about:blank","title":"Ruta no expuesta por el gateway","status":404,"detail":"Consulte deploy/gateway/README.md para la tabla de rutas disponibles"}';
}
