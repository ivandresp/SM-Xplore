# =============================================================================
# SM-Xplore - tabla de rutas del API gateway
# =============================================================================
# Este bloque se incluye DENTRO de cada server (HTTP y HTTPS), por eso no
# declara server ni upstream: solo locations.
#
# Criterio de ruteo:
#   1. Rutas "bonitas": solo para prefijos que pertenecen a UN solo servicio.
#   2. Namespace /svc/ms-0N/...: acceso 1:1 al resto de endpoints del servicio N
#      (nginx recorta el prefijo con el "/" final del proxy_pass). Sirve para los
#      paths que chocan entre servicios y como escape para integraciones.
#   3. /actuator/** y /internal/** NUNCA se exponen (404), tampoco bajo /svc/.
#
# Si agregas un endpoint nuevo a un servicio, agrega aqui la location
# correspondiente; si no lo haces, respondera 404 a traves del gateway.
# =============================================================================

# --- Firmas publicas de ms-01 -------------------------------------------------
location = /.well-known/jwks.json          { proxy_pass http://ms_01; }

# --- ms-01: identidad, usuarios, administracion de usuarios/cuentas -----------
location /api/v1/auth/                     { proxy_pass http://ms_01; }
location /api/v1/users/                    { proxy_pass http://ms_01; }
location /api/v1/public/                   { proxy_pass http://ms_01; }
location /api/v1/admin/users                 { proxy_pass http://ms_01; }
location /api/v1/admin/anomalies           { proxy_pass http://ms_01; }
location /api/v1/admin/anomaly-thresholds  { proxy_pass http://ms_01; }
location /api/v1/admin/audit-logs          { proxy_pass http://ms_01; }
location /api/v1/admin/monitoring          { proxy_pass http://ms_01; }
location /api/v1/admin/reviews/reported    { proxy_pass http://ms_01; }

# --- ms-02: reportes de seguridad --------------------------------------------
location /api/v1/security-reports          { proxy_pass http://ms_02; }

# --- ms-03: actividades, eventos y reservas -----------------------------------
location /api/v1/activities                { proxy_pass http://ms_03; }
location /api/v1/events                    { proxy_pass http://ms_03; }
location /api/v1/review-reports            { proxy_pass http://ms_03; }

# ms-04 gana estas dos rutas de reservas aunque el prefijo general es ms-03.
location = /api/v1/reservations/availability { proxy_pass http://ms_04; }
location ~ ^/api/v1/reservations/[^/]+/status$ { proxy_pass http://ms_04; }
# Resto de reservas (crear, cancelar, asistencia, no-show, consultas) = ms-03.
location /api/v1/reservations              { proxy_pass http://ms_03; }

# --- Reparto de /api/v1/reviews ----------------------------------------------
# Solo se exponen por nombre corto las variantes nunca ambiguas. El POST de
# respuesta y el POST de reporte existen en ms-01, ms-03 y ms-04 con el mismo
# path, por lo que esos se usan via /svc/ms-0N/...
location ~ ^/api/v1/reviews/(events|activities)(/|$) { proxy_pass http://ms_03; }
location ~ ^/api/v1/reviews/(summary|reputation)$    { proxy_pass http://ms_04; }
location ~ ^/api/v1/reviews/[^/]+/status$            { proxy_pass http://ms_04; }

# --- ms-04: catalogo, notificaciones -----------------------------------------
location /api/v1/sites                     { proxy_pass http://ms_04; }
location /api/v1/services                  { proxy_pass http://ms_04; }
location /api/v1/categories                { proxy_pass http://ms_04; }
location /api/v1/zones                     { proxy_pass http://ms_04; }
location /api/v1/notifications             { proxy_pass http://ms_04; }
location /api/v1/admin/notification-contacts { proxy_pass http://ms_04; }
location /api/v1/admin/outbox              { proxy_pass http://ms_04; }
# Por defecto se asume el feed de ms-04 (CATEGORIES|SITES|SERVICES). Para
# entity=ACTIVITIES|EVENTS usar /svc/ms-03/api/v1/admin/catalog/export.
location /api/v1/admin/catalog/export      { proxy_pass http://ms_04; }

# --- ms-05: recomendaciones ---------------------------------------------------
location /api/v1/recommendations           { proxy_pass http://ms_05; }
location /api/v1/preferences               { proxy_pass http://ms_05; }
location /api/v1/interactions              { proxy_pass http://ms_05; }

# --- Namespace 1:1 (recorta /svc/ms-0N/ antes de reenviar) --------------------
location /svc/ms-01/                       { proxy_pass http://ms_01/; }
location /svc/ms-02/                       { proxy_pass http://ms_02/; }
location /svc/ms-03/                       { proxy_pass http://ms_03/; }
location /svc/ms-04/                       { proxy_pass http://ms_04/; }
location /svc/ms-05/                       { proxy_pass http://ms_05/; }

# --- Superficie que el gateway NO publica ------------------------------------
# actuator (metricas internas) e internal (reindex de ms-05). Los ^~ evitan
# que una regex posterior los reescriba; la regex cubre el namespace /svc/.
location ^~ /actuator/                     { return 404; }
location ^~ /internal/                     { return 404; }
location ~ ^/svc/ms-0[1-5]/(actuator|internal)/ { return 404; }

# --- Sin ruta: 404 explicito en formato problem+json -------------------------
location / {
    default_type application/problem+json;
    return 404 '{"type":"about:blank","title":"Ruta no expuesta por el gateway","status":404,"detail":"Consulte deploy/gateway/README.md para la tabla de rutas disponibles"}';
}
