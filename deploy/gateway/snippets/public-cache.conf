# =============================================================================
# SM-Xplore - cache de lecturas publicas del catalogo
# =============================================================================
# Se incluye DENTRO de las locations de solo lectura del catalogo publico:
#   ms-03: /api/v1/activities, /api/v1/events
#   ms-04: /api/v1/sites, /api/v1/services, /api/v1/categories, /api/v1/zones
#
# Motivacion (items 1-2 del txt del PL: "consultas duplicadas" + "agregar
# cache"): una sola pagina /explorar pide zonas, sitios y actividades; con
# StrictMode en desarrollo se duplican y en produccion varios usuarios repiten
# exactamente las mismas lecturas. El cache es compartido por todos los workers
# (zona definida en nginx.conf) y evita que cada visita pague el COUNT + SELECT
# del catalogo en ms-03/ms-04.
#
# Reglas de seguridad del cache:
#   - Solo GET/HEAD: el metodo forma parte de la clave.
#   - Las peticiones con cabecera Authorization NO se cachean ni se sirven del
#     cache ($http_authorization en bypass/no_cache): un ADMIN puede ver
#     entidades no publicadas y esa respuesta nunca debe llegar a un anonimo.
#   - Si el cliente manda Cache-Control, se salta el cache (peticion fresca).
#   - La clave incluye host + request_uri completos (query string incluida), asi
#     que filtros, paginacion y orden tienen su propia entrada.
#   - TTL 10s: una escritura de catalogo puede tardar hasta 10s en reflejarse en
#     el cache. Es el compromiso adoptado para no servir datos viejos por mas
#     tiempo; las escrituras (POST/PATCH/DELETE) no pasan por aqui.
#   - proxy_cache_lock evita que N peticiones identicas simultaneas llenen el
#     upstream a la vez: la primera consulta y las demas esperan su resultado.
#
# Verificacion: la respuesta del gateway incluye X-Cache-Status (MISS/HIT/BYPASS).
# =============================================================================

# nginx no hereda add_header cuando el contexto hijo declara alguno: al agregar
# X-Cache-Status hay que repetir aqui las cabeceras de seguridad del server.
include                /etc/nginx/snippets/security-headers.conf;

proxy_cache            public_catalog;
proxy_cache_key        "$scheme$request_method$host$request_uri";
proxy_cache_valid      200 10s;
proxy_cache_lock       on;
proxy_cache_lock_timeout 5s;
proxy_cache_bypass     $http_authorization $http_cache_control;
proxy_no_cache         $http_authorization;
proxy_ignore_headers   X-Accel-Expires Expires Cache-Control Set-Cookie;
add_header             X-Cache-Status $upstream_cache_status always;
