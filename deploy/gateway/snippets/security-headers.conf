# =============================================================================
# Cabeceras de seguridad comunes (PLAT-16)
# =============================================================================
# Se incluyen en CADA server (y en las location de error que definen add_header
# propio, porque nginx no hereda add_header si el contexto hijo declara alguno).
#
# El gateway solo sirve API JSON y /healthz: no hay HTML ni estaticos, asi que la
# CSP puede ser la mas restrictiva posible. Cache-Control no-store evita que
# respuestas con datos personales (reservas, reportes, resenas) queden en caches
# de navegador o de proxies intermedios.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cache-Control "no-store" always;
