# =============================================================================
# SM-Xplore - servidores HTTP y HTTPS del gateway
# =============================================================================
# Un unico bloque de rutas (snippets/routes.conf) se incluye en ambos servers,
# para que HTTP y HTTPS ofrezcan exactamente la misma superficie.
#
# Certificados: /etc/nginx/certs/tls.crt y tls.key
#   - desarrollo: los genera entrypoint.sh (autofirmados) si no existen.
#   - produccion: se inyectan como secretos con --tlsMode real.
# =============================================================================

# --- HTTP ---------------------------------------------------------------------
server {
    listen 80;
    server_name _;

    # Healthcheck del contenedor (ver healthcheck en compose.yaml).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    include /etc/nginx/snippets/routes.conf;

    error_page 502 504 = @gateway_bad_gateway;
    location @gateway_bad_gateway {
        default_type application/problem+json;
        return 503 '{"type":"about:blank","title":"Servicio no disponible","status":503,"detail":"El servicio de destino no respondio a traves del gateway"}';
    }
}

# --- HTTPS --------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_prefer_server_ciphers off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    include /etc/nginx/snippets/routes.conf;

    error_page 502 504 = @gateway_bad_gateway;
    location @gateway_bad_gateway {
        default_type application/problem+json;
        return 503 '{"type":"about:blank","title":"Servicio no disponible","status":503,"detail":"El servicio de destino no respondio a traves del gateway"}';
    }
}
