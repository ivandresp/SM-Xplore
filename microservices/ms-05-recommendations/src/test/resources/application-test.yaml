app:
  recommendations:
    cache:
      enabled: false
    # The per-user quota is unit tested in isolation; disabling it keeps the web tests
    # from sharing a budget across test methods.
    quota:
      enabled: false
  neo4j:
    initialize-schema: true
  seed:
    enabled: true
  events:
    consumer:
      enabled: false
  security:
    # MS05-06: los tests no llaman a ms-01; la revocacion se desactiva de forma explicita.
    auth-version:
      enabled: false
    docs-public: false
    jwt:
      public-key-location: classpath:keys/test-public.pem
      issuer: https://ms-05.local
      audience: sm-xplore-services
      user-id-claim: userId
      role-claim: role
      name-claim: name

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    org.neo4j.driver: WARN
    com.smxplore.recommendations: INFO
