app:
  seed:
    # Demo catalog with invented ids that do not exist in ms-03/ms-04; enable only with SEED_ENABLED=true.
    enabled: ${SEED_ENABLED:false}
  neo4j:
    initialize-schema: true
  security:
    auth-version:
      # MS05-06: la relajacion solo existe aqui (desarrollo local sin ms-01 disponible).
      enabled: false
    # MS05-07: documentacion y metricas solo se abren en desarrollo local.
    docs-public: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    com.smxplore.recommendations: DEBUG
    org.neo4j.driver: INFO
