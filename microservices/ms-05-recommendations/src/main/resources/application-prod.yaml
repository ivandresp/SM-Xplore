app:
  security:
    jwt:
      # En produccion el JWKS debe ser HTTPS y el flag local queda prohibido.
      allow-insecure-jwks: false
    auth-version:
      enabled: true
    mfa:
      require-admin: true

spring:
  data:
    redis:
      # MS05-05: en produccion Redis debe exigir autenticacion; si falta REDIS_PASSWORD
      # el arranque falla en lugar de conectar a un Redis abierto.
      password: ${REDIS_PASSWORD}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
