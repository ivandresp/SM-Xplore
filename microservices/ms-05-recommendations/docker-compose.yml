services:
  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-change-me}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks:
      - smxplore-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8085}:8080"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-change-me}
      NEO4J_INITIALIZE_SCHEMA: ${NEO4J_INITIALIZE_SCHEMA:-true}
      JWK_SET_URI: ${JWK_SET_URI:-}
      JWT_PUBLIC_KEY_LOCATION: ${JWT_PUBLIC_KEY_LOCATION:-}
      JWT_ISSUER: ${JWT_ISSUER:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-}
      JWT_USER_ID_CLAIM: ${JWT_USER_ID_CLAIM:-userId}
      JWT_ROLE_CLAIM: ${JWT_ROLE_CLAIM:-role}
      JWT_NAME_CLAIM: ${JWT_NAME_CLAIM:-name}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_CONSUMER_GROUP_ID: ${KAFKA_CONSUMER_GROUP_ID:-ms-05-recommendations}
      EVENTS_CONSUMER_ENABLED: ${EVENTS_CONSUMER_ENABLED:-true}
      EVENTS_CONSUMER_MAX_RETRIES: ${EVENTS_CONSUMER_MAX_RETRIES:-3}
      EVENTS_CONSUMER_INITIAL_BACKOFF: ${EVENTS_CONSUMER_INITIAL_BACKOFF:-500ms}
      EVENTS_CONSUMER_MAX_BACKOFF: ${EVENTS_CONSUMER_MAX_BACKOFF:-5s}
      EVENTS_CONSUMER_PROCESSING_TIMEOUT: ${EVENTS_CONSUMER_PROCESSING_TIMEOUT:-15s}
      EVENTS_CONSUMER_BACKOFF_MULTIPLIER: ${EVENTS_CONSUMER_BACKOFF_MULTIPLIER:-2.0}
      EVENTS_CONSUMER_CONCURRENCY: ${EVENTS_CONSUMER_CONCURRENCY:-1}
      EVENTS_CONSUMER_DLQ_SUFFIX: ${EVENTS_CONSUMER_DLQ_SUFFIX:-.dlq}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:4200}
      SEED_ENABLED: ${SEED_ENABLED:-true}
      SPRINGDOC_API_DOCS_ENABLED: ${SPRINGDOC_API_DOCS_ENABLED:-true}
      SPRINGDOC_SWAGGER_UI_ENABLED: ${SPRINGDOC_SWAGGER_UI_ENABLED:-true}
    networks:
      - smxplore-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q UP"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  smxplore-net:
    external: true
    name: smxplore-net

volumes:
  neo4j_data:
