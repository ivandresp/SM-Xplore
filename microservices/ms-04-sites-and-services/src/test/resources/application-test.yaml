app:
  outbox:
    enabled: false
  notifications:
    enabled: false
  reviews:
    # Las pruebas de integracion web crean reseñas sin recorrer el ciclo de reservas;
    # el control MS04-12 se cubre con pruebas unitarias con el flag activo.
    require-completed-booking: false
  security:
    jwt:
      public-key-location: classpath:keys/test-public.pem
      issuer: https://ms-04.local
      audience: sm-xplore-services
      user-id-claim: userId
      role-claim: role
      name-claim: name

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.smxplore.sitesandservices: INFO
    org.springframework.data.mongodb: WARN
    org.springframework.r2dbc: WARN
