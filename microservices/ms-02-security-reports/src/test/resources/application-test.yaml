app:
  outbox:
    enabled: false
  security:
    jwt:
      public-key-location: classpath:keys/test-public.pem
      issuer: sm-xplore-ms-01
      audience: sm-xplore-services
      user-id-claim: userId
      role-claim: role
      name-claim: name
    # El perfil test relaja explicitamente estos controles; no dependen de que falte el perfil prod.
    auth-version:
      enabled: false
    mfa:
      require-admin: false
    photos:
      # MS02-07: en tests se valida la allowlist real; solo se permite el host de los fixtures.
      allowed-hosts: example.com
      allow-any-host: false
      allow-http: false

spring:
  data:
    mongodb:
      auto-index-creation: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
