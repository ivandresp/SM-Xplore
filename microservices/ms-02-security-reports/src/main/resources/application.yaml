spring:
  application:
    name: security-reports
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/security_reports}
  data:
    mongodb:
      auto-index-creation: ${MONGO_AUTO_INDEX_CREATION:false}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    # MS02-09: fuera de local/dev/test el trafico va cifrado (SSL o SASL_SSL); lo exige KafkaSecurityGuard.
    security:
      protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    properties:
      spring.json.add.type.headers: false
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}
      ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
      ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}

# MS02-04: apagado por defecto; solo el perfil local/dev lo enciende.
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        # MS02-04: solo health e info sin JWT. Las metricas se habilitan en local/dev y, si se exponen fuera,
        # el filtro de seguridad las protege con token (nunca son publicas).
        include: ${MANAGEMENT_EXPOSED_ENDPOINTS:health,info}

app:
  security:
    jwt:
      jwk-set-uri: ${JWK_SET_URI:}
      public-key-location: ${JWT_PUBLIC_KEY_LOCATION:}
      # Solo desarrollo: acepta HTTP cuando el JWKS no es loopback (stack de Compose).
      allow-insecure-jwks: ${JWT_ALLOW_INSECURE_JWKS:false}
      issuer: ${JWT_ISSUER:sm-xplore-ms-01}
      audience: ${JWT_AUDIENCE:sm-xplore-services}
      user-id-claim: ${JWT_USER_ID_CLAIM:userId}
      role-claim: ${JWT_ROLE_CLAIM:role}
      name-claim: ${JWT_NAME_CLAIM:name}
    auth-version:
      # MS02-05: activada por defecto; local/dev/test la apagan explicitamente.
      enabled: ${AUTH_VERSION_ENABLED:true}
      base-url: ${MS01_BASE_URL:http://ms-01:8081}
      timeout: ${AUTH_VERSION_TIMEOUT:2s}
      cache-ttl: ${AUTH_VERSION_CACHE_TTL:60s}
      # Cota de entradas y de TTL (max 5 min): el TTL es la ventana real de revocacion.
      cache-max-entries: ${AUTH_VERSION_CACHE_MAX_ENTRIES:10000}
    mfa:
      # MS02-05: exigido por defecto fuera de local/dev/test.
      require-admin: ${MFA_REQUIRE_ADMIN:true}
    # MS02-12: HSTS solo cuando el servicio esta detras de un terminador TLS; el borde puede enviarlo.
    headers:
      hsts: ${HSTS_ENABLED:false}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}
    rate-limit:
      enabled: ${REPORT_RATE_LIMIT_ENABLED:true}
      # MS02-03: cupos por cuenta (sub del JWT), con la IP solo como respaldo sin principal.
      requests-per-minute: ${REPORT_RATE_LIMIT_PER_MINUTE:30}
      comments-per-minute: ${COMMENT_RATE_LIMIT_PER_MINUTE:30}
      writes-per-minute: ${WRITE_RATE_LIMIT_PER_MINUTE:60}
      trusted-proxies: "${TRUSTED_PROXIES:127.0.0.1/32,::1/128,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}"
    photos:
      # MS02-07: allowlist de hosts; vacia = no se aceptan fotos fuera de local/dev/test.
      allowed-hosts: "${PHOTO_ALLOWED_HOSTS:}"
      allow-http: ${PHOTO_ALLOW_HTTP:false}
      allow-any-host: ${PHOTO_ALLOW_ANY_HOST:false}
  outbox:
    enabled: ${OUTBOX_ENABLED:true}
    producer: ${OUTBOX_PRODUCER:ms-02}
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}
    batch-size: ${OUTBOX_BATCH_SIZE:50}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:20}
    initial-backoff: ${OUTBOX_INITIAL_BACKOFF:1s}
    max-backoff: ${OUTBOX_MAX_BACKOFF:1m}
    lease-duration: ${OUTBOX_LEASE_DURATION:3m}
    # MS02-09: el outbox guarda el evento con PII; 7 dias bastan para reintentos y diagnostico.
    retention-days: ${OUTBOX_RETENTION_DAYS:7}
    retention-interval-ms: ${OUTBOX_RETENTION_INTERVAL_MS:3600000}
  # MS02-16: el backfill de datos heredados corre por lotes y con presupuesto de tiempo.
  migration:
    enabled: ${MIGRATION_ENABLED:true}
    batch-size: ${MIGRATION_BATCH_SIZE:100}
    timeout: ${MIGRATION_TIMEOUT:60s}
