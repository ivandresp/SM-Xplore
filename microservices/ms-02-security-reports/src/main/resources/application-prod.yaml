app:
  security:
    jwt:
      # En produccion el JWKS debe ser HTTPS y el flag local queda prohibido.
      allow-insecure-jwks: false
    auth-version:
      enabled: true
    mfa:
      require-admin: true
    photos:
      allow-http: false
      allow-any-host: false
    headers:
      # MS02-12: produccion va detras de TLS, asi que el servicio refuerza HSTS.
      hsts: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
