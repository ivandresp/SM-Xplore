server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: activities-and-events
  r2dbc:
    url: ${R2DBC_URL:r2dbc:postgresql://localhost:5432/activities_events}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    pool:
      max-size: ${R2DBC_POOL_MAX_SIZE:20}
      max-acquire-time: 5s
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/reviews?uuidRepresentation=standard}
  data:
    mongodb:
      auto-index-creation: ${MONGO_AUTO_INDEX_CREATION:true}
  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
      schema-locations: classpath:schema.sql

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}

app:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      issuer: ${JWT_ISSUER:https://activitiesevents.local}
      audience: ${JWT_AUDIENCE:}
      role-claim: ${JWT_ROLE_CLAIM:role}
      name-claim: ${JWT_NAME_CLAIM:name}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}
