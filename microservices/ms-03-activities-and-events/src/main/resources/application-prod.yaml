app:
  security:
    jwt:
      # En produccion el JWKS debe ser HTTPS y el flag local queda prohibido.
      allow-insecure-jwks: false
    auth-version:
      enabled: true
    mfa:
      require-admin: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoint:
    health:
      show-details: never