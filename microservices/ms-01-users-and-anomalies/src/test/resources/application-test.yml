app:
  bootstrap-admin:
    enabled: false
  security:
    jwt:
      issuer: sm-xplore-ms-01
      audience: sm-xplore-services
      ttl: PT60M
      key-store-path: build/test-jwt/keys.pem
      allow-generated-keys: true
    password-reset:
      ttl: PT30M
    account-invitation:
      ttl: PT48H
  cors:
    allowed-origins:
      - http://localhost:5173
  frontend:
    base-url: http://localhost:5173
    reset-password-path: /reset-password

spring:
  mail:
    host: localhost
    port: 1025
