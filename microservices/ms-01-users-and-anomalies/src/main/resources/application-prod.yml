## Perfil de producción: sin valores por defecto de desarrollo y con verificaciones de arranque.
app:
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
  security:
    jwt:
      allow-generated-keys: false
    mfa:
      required-for-admins: ${MFA_REQUIRED_FOR_ADMINS:true}
    headers:
      hsts-enabled: ${SECURITY_HSTS_ENABLED:true}
  reviews:
    index-initialization:
      enabled: ${REVIEW_INDEX_INIT:false}
    ai-filter:
      # MS01-09: en producción, si el filtro de IA falla o responde algo inválido la reseña NO se publica.
      fail-open: false

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        # En produccion solo el scrape: /actuator/metrics/{name} expone nombres y tags internos.
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

server:
  shutdown: graceful
  # No reescribir la IP del cliente a partir de cabeceras reenviadas: nginx es el único borde de confianza.
  forward-headers-strategy: none

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s

logging:
  level:
    root: INFO
    com.smxplore: INFO
